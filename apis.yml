aid: the-atlas-marketplace
name: The Atlas Marketplace
description: >-
  The Atlas Marketplace (branded "The Atlas") is a free online community and
  knowledge marketplace for local government leaders. Officials and staff use it
  to learn from their peers about the smart, safe, and sustainable solutions
  working in their communities, browsing a searchable library of case studies,
  vendors, and civic-technology projects. The platform connects public-sector
  practitioners with the companies and partners behind proven municipal
  solutions across mobility, infrastructure, sustainability, and public safety.
  Backed by 500 Global, it operates as a content and community website rather
  than a developer/API product; this profile was added to the API Evangelist
  network as a portfolio lead and enriched from its public web presence.
